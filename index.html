<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>足部訓練工具</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#1D9E75;--tl:#E1F5EE;--tm:#5DCAA5;--td:#0F6E56;
  --amb:#EF9F27;--al:#FAEEDA;--amd:#854F0B;
  --red:#E24B4A;
  --warm1:#5B9BD5;--warm1l:#EBF3FB;--warm1d:#2E6DA4;
  --bg:#fff;--bg2:#f7f6f2;--bg3:#f0ede8;
  --tx:#1a1a1a;--tx2:#6b6b6b;--tx3:#999;
  --br:#e0ddd8;--br2:#ccc;
  --ra:14px;--ra2:10px;
  --shadow:0 2px 8px rgba(0,0,0,.07);
  --max:480px;
}

/* Base */
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Noto Sans TC',sans-serif;
  background:var(--bg3);
  min-height:100vh;
  min-height:-webkit-fill-available;
  padding:env(safe-area-inset-top,12px) env(safe-area-inset-right,12px) calc(env(safe-area-inset-bottom,0px)+20px) env(safe-area-inset-left,12px);
  padding-top:max(env(safe-area-inset-top),12px);
  -webkit-tap-highlight-color:transparent;
}
.app{
  max-width:var(--max);
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:.65rem;
}

/* ── 首頁 ── */
.home{display:flex;flex-direction:column;gap:.65rem}
.home-hdr{
  background:var(--bg);
  border-radius:var(--ra);
  border:1px solid var(--br);
  padding:20px 16px 16px;
  text-align:center;
}
.home-hdr h1{font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-.3px}
.home-hdr p{font-size:13px;color:var(--tx2);margin-top:5px}

/* 首頁卡片：手機單欄，大螢幕雙欄 */
.mode-cards{display:flex;flex-direction:column;gap:.65rem}
@media(min-width:420px){
  .mode-cards{flex-direction:row}
  .mode-card{flex:1}
}
.mode-card{
  background:var(--bg);
  border-radius:var(--ra);
  border:2px solid var(--br);
  padding:20px 16px;
  display:flex;
  align-items:center;
  gap:14px;
  cursor:pointer;
  transition:border-color .2s,transform .1s,box-shadow .2s;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  text-align:left;
}
.mode-card:active{transform:scale(.98)}
.mode-card:hover{border-color:var(--tm);box-shadow:var(--shadow)}
.mode-card.warm:hover{border-color:var(--warm1)}
@media(min-width:420px){
  .mode-card{flex-direction:column;align-items:center;text-align:center;padding:22px 14px}
}
.mode-icon{
  width:56px;height:56px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
  flex-shrink:0;
}
.mode-icon.green{background:var(--tl);color:var(--td)}
.mode-icon.blue{background:var(--warm1l);color:var(--warm1d)}
.mode-text{flex:1}
@media(min-width:420px){.mode-text{flex:unset;width:100%}}
.mode-title{font-size:17px;font-weight:700;color:var(--tx);letter-spacing:-.2px}
.mode-sub{font-size:12.5px;color:var(--tx2);line-height:1.6;margin-top:4px}
.mode-badge{
  display:inline-block;
  font-size:11px;padding:3px 9px;
  border-radius:20px;font-weight:600;
  margin-bottom:5px;
}
.mode-badge.g{background:var(--tl);color:var(--td)}
.mode-badge.b{background:var(--warm1l);color:var(--warm1d)}

/* ── Header ── */
.hdr{
  background:var(--bg);border-radius:var(--ra);border:1px solid var(--br);
  padding:12px 14px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:10;
}
.hdr-back{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--br);background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;color:var(--tx2);
  -webkit-tap-highlight-color:transparent;
}
.hdr-back:active{background:var(--bg2)}
.hic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hic.green{background:var(--tl)} .hic.green i{font-size:18px;color:var(--td)}
.hic.blue{background:var(--warm1l)} .hic.blue i{font-size:18px;color:var(--warm1d)}
.htx{flex:1;min-width:0}
.htx h1{font-size:15px;font-weight:700;color:var(--tx);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htx p{font-size:11px;color:var(--tx2);margin-top:1px}

/* ── Step nav ── */
.steprow{
  background:var(--bg);border-radius:var(--ra);border:1px solid var(--br);
  padding:11px 12px;display:flex;align-items:flex-start;
  overflow-x:auto;scrollbar-width:none;gap:0;
  -webkit-overflow-scrolling:touch;
}
.steprow::-webkit-scrollbar{display:none}
.sdot{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex-shrink:0;min-width:54px;-webkit-tap-highlight-color:transparent}
.sn{width:27px;height:27px;border-radius:50%;border:1.5px solid var(--br2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--tx2);background:var(--bg);transition:all .2s}
.sdot.done .sn{background:var(--teal);border-color:var(--teal);color:#fff}
.sdot.cur .sn{background:var(--tl);border-color:var(--teal);color:var(--td)}
.sdot.wdone .sn{background:var(--warm1);border-color:var(--warm1);color:#fff}
.sdot.wcur .sn{background:var(--warm1l);border-color:var(--warm1);color:var(--warm1d)}
.sl{font-size:10.5px;color:var(--tx2);text-align:center;line-height:1.3;white-space:nowrap}
.sdot.cur .sl{color:var(--td);font-weight:600}
.sdot.wcur .sl{color:var(--warm1d);font-weight:600}
.sdot.done .sl{color:var(--teal);font-weight:500}
.sdot.wdone .sl{color:var(--warm1);font-weight:500}
.sbar{flex:1;height:1.5px;background:var(--br);min-width:4px;max-width:16px;flex-shrink:1;margin-top:12px;transition:background .3s}
.sbar.done{background:var(--teal)} .sbar.wdone{background:var(--warm1)}

/* ── Voice row ── */
.vrow{
  background:var(--bg);border-radius:var(--ra2);border:1px solid var(--br);
  padding:9px 14px;display:flex;align-items:center;gap:10px;
}
.vlbl{font-size:13px;color:var(--tx2);flex:1}
.vst{font-size:12px;color:var(--td);font-weight:600}
.tgl{width:38px;height:22px;background:var(--teal);border-radius:11px;border:none;cursor:pointer;position:relative;flex-shrink:0;transition:background .2s}
.tgl.off{background:#ccc}
.tgl::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl:not(.off)::after{transform:translateX(16px)}

/* ── Card ── */
.card{background:var(--bg);border-radius:var(--ra);border:1px solid var(--br);overflow:hidden;box-shadow:var(--shadow)}
.ctop{padding:11px 14px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:9px}
.cnum{width:24px;height:24px;border-radius:50%;background:var(--tl);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--td);flex-shrink:0}
.cnum.blue{background:var(--warm1l);color:var(--warm1d)}
.ct{font-size:15px;font-weight:700;color:var(--tx);flex:1;letter-spacing:-.2px}
.cbdg{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--tl);color:var(--td);font-weight:600;border:1px solid rgba(29,158,117,.2);white-space:nowrap}
.cbdg.blue{background:var(--warm1l);color:var(--warm1d);border-color:rgba(91,155,213,.25)}
.cbody{padding:12px;display:flex;flex-direction:column;gap:10px}

/* ── Image ── */
.illus-wrap{background:var(--bg2);border-radius:var(--ra2);border:1px solid var(--br);overflow:hidden}
.illus-wrap img{width:100%;height:auto;display:block}

/* ── Warm blocks ── */
.warm-inst{display:flex;flex-direction:column;gap:7px}
.warm-block{background:var(--bg2);border-radius:var(--ra2);border:1px solid var(--br);padding:10px 12px}
.warm-block-title{font-size:13px;font-weight:700;color:var(--warm1d);margin-bottom:5px;display:flex;align-items:center;gap:6px}
.warm-block-title i{font-size:14px}
.warm-steps{display:flex;flex-direction:column;gap:4px}
.warm-step{font-size:13px;color:var(--tx2);line-height:1.7;padding-left:13px;position:relative}
.warm-step::before{content:'•';position:absolute;left:0;color:var(--warm1);font-weight:700}
.warm-step strong{color:var(--tx);font-weight:600}
.warm-tip{font-size:12px;color:var(--amd);background:var(--al);border-radius:8px;padding:8px 11px;display:flex;align-items:flex-start;gap:7px}
.warm-tip i{flex-shrink:0;margin-top:1px;font-size:14px}

/* ── Chips / Steppers ── */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.chip{background:var(--bg2);border:1px solid var(--br);border-radius:var(--ra2);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .2s}
.chip.mod{border-color:var(--amb)}
.chip-label{font-size:11px;color:var(--tx2);text-align:center}
.chip.mod .chip-label{color:var(--amd)}
.chip-val{font-size:19px;font-weight:700;color:var(--td);line-height:1}
.stepper{display:flex;align-items:center;gap:4px}
.stp-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--teal);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--teal);line-height:1;transition:background .15s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.stp-btn:active{background:var(--tl)}
.stp-btn.green{border-color:var(--teal);color:var(--teal)}
.stp-btn.green:active{background:var(--tl)}
.stp-val{font-size:20px;font-weight:700;color:var(--td);min-width:26px;text-align:center}
.stp-val.green{color:var(--td)}

/* ── Phase indicator ── */
.phi{display:none;align-items:center;gap:8px;font-size:13px;color:var(--tx);padding:8px 12px;border-radius:var(--ra2);border:1px solid var(--tm);background:var(--tl)}
.phd{width:8px;height:8px;border-radius:50%;background:var(--teal);flex-shrink:0}
.phd.rest{background:var(--amb)}
.phi.wphi{border-color:var(--warm1);background:var(--warm1l)}
.phi.wphi .phd{background:var(--warm1)}

/* ── Timer ring ── */
.twrap{display:flex;justify-content:center;padding:2px 0}
.rw{position:relative;width:90px;height:90px}
.rw svg{transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--br);stroke-width:6}
.fil{fill:none;stroke:var(--teal);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.fil.blue{stroke:var(--warm1)}
.rlb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rn{font-family:'DM Mono',monospace;font-size:26px;font-weight:500;color:var(--tx);line-height:1}
.ru{font-size:11px;color:var(--tx2);margin-top:2px}

/* ── Done banner ── */
.dban{display:none;border-radius:var(--ra2);padding:10px 13px;text-align:center;font-size:13px;font-weight:600}
.dban.green{background:var(--tl);border:1px solid var(--tm);color:var(--td)}
.dban.blue{background:var(--warm1l);border:1px solid var(--warm1);color:var(--warm1d)}

/* ── Buttons ── */
.btns{display:flex;gap:8px}
.bgo{
  flex:2;color:#fff;border:none;border-radius:var(--ra2);
  padding:14px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:opacity .2s;min-height:48px;
  -webkit-tap-highlight-color:transparent;
}
.bgo.green{background:var(--teal)} .bgo.blue{background:var(--warm1)}
.bgo:active{opacity:.82} .bgo:disabled{opacity:.5;cursor:default}
.brst{
  flex:1;background:transparent;border:1px solid var(--br);border-radius:var(--ra2);
  padding:14px;font-size:13px;color:var(--tx2);cursor:pointer;font-family:inherit;
  min-height:48px;-webkit-tap-highlight-color:transparent;
}
.brst:active{background:var(--bg2)}
.nav{display:flex;gap:8px}
.npv{
  flex:1;background:transparent;border:1px solid var(--br);border-radius:var(--ra2);
  padding:13px;font-size:13px;color:var(--tx2);cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:4px;
  min-height:48px;-webkit-tap-highlight-color:transparent;
}
.npv:active:not(:disabled){background:var(--bg2)}
.npv:disabled{opacity:.3;cursor:default}
.nnx{
  flex:2;color:#fff;border:none;border-radius:var(--ra2);
  padding:13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:5px;
  min-height:48px;-webkit-tap-highlight-color:transparent;
}
.nnx.green{background:var(--td)} .nnx.blue{background:var(--warm1d)}
.nnx:active{opacity:.85}

/* ── Done screen ── */
.done-scr{text-align:center;padding:24px 14px 28px}
.done-ic{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto .9rem}
.done-ic.green{background:var(--tl)} .done-ic.blue{background:var(--warm1l)}
.done-scr h2{font-size:20px;font-weight:700;color:var(--tx);margin-bottom:.4rem}
.done-scr p{font-size:14px;color:var(--tx2);line-height:1.9}
.bres{
  margin-top:1.2rem;color:#fff;border:none;border-radius:var(--ra2);
  padding:12px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:6px;min-height:46px;
  -webkit-tap-highlight-color:transparent;
}
.bres.green{background:var(--teal)} .bres.blue{background:var(--warm1)}
.bres:active{opacity:.85}

/* ── Tip bar ── */
.tip{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--tx2);background:var(--bg2);border-radius:var(--ra2);padding:9px 11px;border:1px solid var(--br)}
.tip i{flex-shrink:0;margin-top:1px;font-size:14px}

/* ── Legend ── */
.leg{display:flex;gap:6px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2)}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── Progress bar ── */
.warm-progress{display:flex;gap:4px;align-items:center}
.warm-progress div{flex:1;height:3px;border-radius:2px;background:var(--br);transition:background .4s}
</style>
</head>

let mode='home';
let custom={}, rcur=0, voiceOn=true, tmr=null, cS={}, totS=0, ss=null;

// ── 工具 ──
function getVal(id,key){
  if(custom[id]&&custom[id][key]!==undefined)return custom[id][key];
  if(key==='holdSec'){
    try{const saved=localStorage.getItem('holdSec_'+id);if(saved!==null)return parseInt(saved);}catch(e){}
  }
  return DEFAULTS.find(e=>e.id===id)[key];
}
function isModified(id){const d=DEFAULTS.find(e=>e.id===id);if(!custom[id])return false;return(custom[id].sets!==undefined&&custom[id].sets!==d.sets)||(custom[id].holdSec!==undefined&&custom[id].holdSec!==d.holdSec);}
function togV(){
  voiceOn=!voiceOn;
  const t=document.getElementById('vtgl'),s=document.getElementById('vst');
  if(t){t.classList.toggle('off',!voiceOn);t.style.background=voiceOn?'var(--warm1)':'#ccc';}
  if(s)s.textContent=voiceOn?'開啟':'關閉';
}
function spk(t){if(!voiceOn||!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=0.9;window.speechSynthesis.speak(u);}

// ── 主渲染 ──
function render(){
  const app=document.getElementById('app');
  if(mode==='home'){app.innerHTML=homeHTML();return;}
  if(mode==='warm'){app.innerHTML=warmHTML();return;}
  if(mode==='rehab'){app.innerHTML=rehabHTML();return;}
}

// 更新畫面（不重建整頁，只換圖片+文字+tab 樣式）
function updateWarmUI(stepIdx){
  const ex=WARM[wcur];
  const step=ex.steps[stepIdx];
  if(!step)return;
  wStep=stepIdx;

  // 更新 tab 樣式
  ex.steps.forEach((_,i)=>{
    const tab=document.getElementById('wtab_'+i);
    if(!tab)return;
    const active=i===stepIdx;
    tab.style.fontWeight=active?'700':'400';
    tab.style.borderColor=active?'var(--warm1)':'var(--br)';
    tab.style.background=active?'var(--warm1l)':'var(--bg)';
    tab.style.color=active?'var(--warm1d)':'var(--tx2)';
  });

  // 更新進度條
  const actionSteps=ex.steps.filter(s=>s.spk);
  actionSteps.forEach((s,i)=>{
    const bar=document.getElementById('wprog_'+i);
    if(bar)bar.style.background=ex.steps.indexOf(s)<stepIdx?'var(--warm1)':'var(--br)';
  });

  // 更新圖片（淡入淡出效果）—圖片區永遠顯示
  const imgWrap=document.getElementById('warm-img-wrap');
  const img=document.getElementById('warm-img');
  if(imgWrap)imgWrap.style.display='';
  if(img&&step.img&&WARM_IMGS[step.img]){
    img.style.opacity='0';
    img.src=WARM_IMGS[step.img];
    img.alt=step.title;
    setTimeout(()=>{if(img)img.style.opacity='1';},80);
  }

  // 更新說明文字
  const titleEl=document.getElementById('warm-desc-title');
  const linesEl=document.getElementById('warm-desc-lines');
  const iconEl=document.querySelector('#warm-desc .warm-block-title i');
  if(titleEl)titleEl.textContent=step.title;
  if(iconEl){iconEl.className='ti '+step.icon;}
  if(linesEl)linesEl.innerHTML=step.lines.map(l=>`<div class="warm-step">${l}</div>`).join('');

  // 更新相位文字
  const pht=document.getElementById('pht');
  if(pht)pht.textContent=step.img?step.title:'計時中';
}

function wgo(i){if(wtmr){clearInterval(wtmr);wtmr=null;}wcur=i;wStep=0;render();}
function backHome(){
  if(wtmr){clearInterval(wtmr);wtmr=null;}

function startWarm(){
  const ex=WARM[wcur];
  if(wtmr)return;
  const btn=document.getElementById('bgo');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader"></i> 進行中…';}
  if(!wSS)wSS=Date.now();
  // 立刻顯示說明頁（含圖片）+ 播放開場語音
  updateWarmUI(0);
  spk(ex.spk.s);
  // 1.5 秒後開始計時（讓開場語音說完）
  setTimeout(()=>{ if(mode==='warm')runWarmTimer(ex); }, 1500);
}

function runWarmTimer(ex){
  const dur=ex.dur;
  const ring=document.getElementById('ring'),tc=document.getElementById('tc');
  const phi=document.getElementById('phi'),phd=document.getElementById('phd'),pht=document.getElementById('pht');
  if(!ring)return;
  phi.style.display='flex';
  if(phd)phd.style.background='var(--warm1)';
  if(pht)pht.textContent='計時中';

  let rem=dur;
  tc.textContent=rem;
  ring.style.strokeDashoffset='0';
  ring.style.stroke='var(--warm1)';

  // 建立精確的時間表：每個有圖片的 step 分配時間
  // 例如足底放鬆有3個動作step，各佔 dur/3 秒
  const actionSteps=ex.steps.map((s,i)=>({...s,idx:i})).filter(s=>s.spk);
  const slotSec=Math.floor(dur/Math.max(actionSteps.length,1));

  // 排程：在第 slotSec*0, slotSec*1, slotSec*2 秒觸發切換
  // rem從dur倒數到0，在 rem===dur-slotSec*(n+1) 時觸發第n個
  const triggers=actionSteps.map((s,n)=>({
    rem: dur - slotSec*(n+1), // 觸發時的 rem 值（最後一個用 rem<=slotSec 保底）
    step: s,
    n: n
  }));

  let triggered=new Set();
  // 不立刻跳，讓說明圖先展示，計時後再依時間表切換

  wtmr=setInterval(()=>{
    rem--;
    const t=document.getElementById('tc'),r=document.getElementById('ring');
    if(!t){clearInterval(wtmr);wtmr=null;return;}
    t.textContent=rem;
    r.style.strokeDashoffset=C42*(1-rem/dur);

    // 切換動作圖與語音
    triggers.forEach((trig,n)=>{
      if(triggered.has(n))return;
      if(rem<=trig.rem||(n===triggers.length-1&&rem<=slotSec)){
        triggered.add(n);
        updateWarmUI(trig.step.idx);
        spk(trig.step.spk);
      }
    });

    if(rem<=0){
      clearInterval(wtmr);wtmr=null;
      wS[ex.id]=1;
      spk(ex.spk.e);

      // 更新完成狀態
      const ban=document.getElementById('ban');
      const bgo=document.getElementById('bgo');
      if(ban)ban.style.display='block';
      if(bgo){bgo.innerHTML='<i class="ti ti-circle-check"></i> 已完成';bgo.style.background='var(--warm1d)';bgo.disabled=true;}
      if(phi)phi.style.display='none';
      if(tc)tc.textContent='✓';

      const last=wcur===WARM.length-1;
      if(!last){
        // 自動換到下一個，10秒倒數
        let cnt=10;
        if(phi)phi.style.display='flex';
        if(phd)phd.style.background='var(--amb)';
        if(pht)pht.textContent=`10 秒後自動繼續`;
        if(tc)tc.textContent=cnt;
        if(ring){ring.style.stroke='var(--amb)';ring.style.strokeDashoffset='0';}
        wtmr=setInterval(()=>{
          cnt--;
          const tx=document.getElementById('tc'),rx=document.getElementById('ring'),px=document.getElementById('pht');
          if(!tx){clearInterval(wtmr);wtmr=null;return;}
          tx.textContent=cnt;
          if(rx)rx.style.strokeDashoffset=C42*(1-cnt/10);
          if(px)px.textContent=`${cnt} 秒後自動繼續`;
          if(cnt<=0){clearInterval(wtmr);wtmr=null;wgo(wcur+1);startWarm();}
        },1000);
      }
    }
  },1000);
}

  if(!ss)ss=Date.now();

}
function runSet(id,ex,n){
  const sets=getVal(id,'sets'),hold=getVal(id,'holdSec');
  const ring=document.getElementById('ring'),tc=document.getElementById('tc'),phi=document.getElementById('phi'),phd=document.getElementById('phd'),pht=document.getElementById('pht');
  if(!ring)return;
  phi.style.display='flex';phd.className='phd';pht.textContent=`第 ${n} / ${sets} 組`;
  let rem=hold;tc.textContent=rem;ring.style.strokeDashoffset='0';ring.style.stroke='var(--teal)';
  const mid=Math.floor(hold/2);
  tmr=setInterval(()=>{
    rem--;
    const t=document.getElementById('tc'),r=document.getElementById('ring');
    if(!t){clearInterval(tmr);tmr=null;return;}
    t.textContent=rem;r.style.strokeDashoffset=C42*(1-rem/hold);
    if(rem===mid)spk(ex.vc.m);
    if(rem<=0){
      clearInterval(tmr);tmr=null;
      const d=(cS[id]||0)+1;cS[id]=d;totS++;
      renderChips();
      if(d>=sets){spk('右腳'+ex.title+'全部完成！');mkDone(sets);}
      else{spk(ex.vc.e);const p=document.getElementById('phd'),pt=document.getElementById('pht');if(p)p.className='phd rest';if(pt)pt.textContent=`休息 ${ex.restSec} 秒`;runRest(id,ex,n+1,ex.restSec);}
    }
  },1000);
}
function runRest(id,ex,nxt,rs){
  let rem=rs;const t=document.getElementById('tc'),r=document.getElementById('ring');
  if(t)t.textContent=rem;if(r){r.style.stroke='var(--amb)';r.style.strokeDashoffset='0';}
  tmr=setInterval(()=>{
    rem--;const t2=document.getElementById('tc'),r2=document.getElementById('ring');
    if(!t2){clearInterval(tmr);tmr=null;return;}
    t2.textContent=rem;r2.style.strokeDashoffset=C42*(1-rem/rs);
    if(rem<=0){clearInterval(tmr);tmr=null;r2.style.stroke='var(--teal)';spk('休息結束，開始第'+nxt+'組');runSet(id,ex,nxt);}
  },1000);
}
function mkDone(sets){
  const ban=document.getElementById('ban'),b=document.getElementById('bgo'),phi=document.getElementById('phi'),tc=document.getElementById('tc');
  if(ban)ban.style.display='block';
  if(b){b.innerHTML='<i class="ti ti-circle-check"></i> 已完成';b.style.background='var(--td)';b.disabled=true;}
  if(phi)phi.style.display='none';if(tc)tc.textContent='✓';
  // 步驟列更新
  const sr=document.getElementById('steprow');if(sr)sr.outerHTML=rehabStepRow();
  if(!isModified(DEFAULTS[rcur].id)&&rcur<DEFAULTS.length-1)autoNext();
}
function autoNext(){
  let rem=15;
  const phi=document.getElementById('phi'),phd=document.getElementById('phd'),pht=document.getElementById('pht');
  const ring=document.getElementById('ring'),tc=document.getElementById('tc');
  if(phi)phi.style.display='flex';if(phd)phd.className='phd rest';
  if(pht)pht.textContent=`換姿勢休息 ${rem} 秒`;
  if(ring){ring.style.stroke='var(--amb)';ring.style.strokeDashoffset='0';}
  if(tc)tc.textContent=rem;
  spk('動作完成，休息15秒後自動進行下一個動作');
  tmr=setInterval(()=>{
    rem--;const t=document.getElementById('tc'),r=document.getElementById('ring'),pt=document.getElementById('pht');
    if(!t){clearInterval(tmr);tmr=null;return;}
    t.textContent=rem;if(r)r.style.strokeDashoffset=C42*(1-rem/15);if(pt)pt.textContent=`換姿勢休息 ${rem} 秒`;
    if(rem<=0){clearInterval(tmr);tmr=null;rgo(rcur+1);startEx();}
  },1000);
}
function rst(){if(tmr){clearInterval(tmr);tmr=null;}cS[DEFAULTS[rcur].id]=0;render();}
function finishAll(){
  if(tmr){clearInterval(tmr);tmr=null;}
  const mins=ss?Math.round((Date.now()-ss)/60000):0;
  spk('今日訓練全部完成，做得非常好！');
  document.getElementById('app').innerHTML=`<div class="hdr">
  <button class="hdr-back" onclick="backHome()"><i class="ti ti-arrow-left" style="font-size:15px"></i></button>
  <div class="hic green"><i class="ti ti-run"></i></div>
  <div class="htx"><h1>垂足背屈復健訓練</h1><p>訓練完成</p></div>
</div>
<div class="card">
  <div class="done-scr">
    <div class="done-ic green"><i class="ti ti-trophy" style="font-size:30px;color:var(--teal)"></i></div>
    <h2>今日訓練完成！</h2>
    <p>完成 <strong>${totS}</strong> 組 · 訓練 <strong>${mins}</strong> 分鐘<br><br>右腳復健需要每日堅持，<br>每週進步 1–2° 就是很好的成果。</p>
    <button class="bres green" onclick="setMode('rehab')"><i class="ti ti-refresh"></i> 重新開始</button>
    <br><button onclick="backHome()" style="margin-top:12px;background:transparent;border:none;color:var(--tx2);font-family:inherit;font-size:13px;cursor:pointer">← 回首頁</button>
  </div>
</div>`;
}

render();
</script>
</body>
</html>
