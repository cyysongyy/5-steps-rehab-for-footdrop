<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>垂足背屈復健訓練</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#1D9E75;--tl:#E1F5EE;--tm:#5DCAA5;--td:#0F6E56;--amb:#EF9F27;--al:#FAEEDA;--red:#E24B4A;--bg:#fff;--bg2:#f5f5f0;--tx:#1a1a1a;--tx2:#6b6b6b;--br:#e0ddd8;--ra:12px}
body{font-family:'Noto Sans TC',sans-serif;background:#f0ede8;min-height:100vh;padding:1.2rem}
.app{max-width:560px;margin:0 auto}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:1rem;background:var(--bg);border-radius:var(--ra);padding:14px 16px;border:1px solid var(--br)}
.hic{width:40px;height:40px;background:var(--tl);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hic i{font-size:26px;color:var(--td)}
.htx h1{font-size:21px;font-weight:700;color:var(--tx)}
.htx p{font-size:16px;color:var(--tx2);margin-top:1px}
.steprow{display:flex;align-items:center;margin-bottom:1rem;overflow-x:auto;padding:12px 16px;background:var(--bg);border-radius:var(--ra);border:1px solid var(--br);scrollbar-width:none}
.steprow::-webkit-scrollbar{display:none}
.sdot{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex-shrink:0;padding:0 2px}
.sn{width:32px;height:32px;border-radius:50%;border:2px solid var(--br);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--tx2);background:var(--bg);transition:all .25s}
.sdot.done .sn{background:var(--teal);border-color:var(--teal);color:#fff}
.sdot.cur .sn{background:var(--tl);border-color:var(--teal);color:var(--td)}
.sl{font-size:19px;color:var(--tx2);white-space:nowrap;text-align:center;line-height:1.2;max-width:52px}
.sdot.cur .sl{color:var(--td);font-weight:500}
.sbar{flex:1;height:2px;background:var(--br);min-width:8px;max-width:24px;flex-shrink:1;margin-bottom:14px;transition:background .3s}
.sbar.done{background:var(--teal)}
.vrow{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg);border-radius:var(--ra);border:1px solid var(--br);margin-bottom:1rem}
.vlbl{font-size:17px;color:var(--tx2);flex:1}
.vst{font-size:16px;color:var(--td);font-weight:500}
.tgl{width:36px;height:20px;background:var(--teal);border-radius:10px;border:none;cursor:pointer;position:relative;flex-shrink:0;transition:background .2s}
.tgl.off{background:#ccc}
.tgl::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s}
.tgl:not(.off)::after{transform:translateX(16px)}
.card{background:var(--bg);border:1px solid var(--br);border-radius:var(--ra);overflow:hidden}
.ctop{padding:12px 16px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:10px}
.cn{width:28px;height:28px;border-radius:50%;background:var(--tl);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:var(--td);flex-shrink:0}
.ct{font-size:19px;font-weight:500;color:var(--tx);flex:1}
.cbdg{font-size:21px;padding:2px 8px;border-radius:20px;background:var(--al);color:#854F0B;font-weight:500}
.cbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.illus{width:100%;height:195px;border-radius:8px;background:var(--bg2);border:1px solid var(--br);overflow:hidden}
.isvg{width:100%;height:100%}
.leg{display:flex;gap:10px;flex-wrap:wrap;padding:6px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--br)}
.li{display:flex;align-items:center;gap:4px;font-size:21px;color:var(--tx2)}
.ld{width:8px;height:8px;border-radius:50%}
.inst{font-size:34px;color:var(--tx2);line-height:1.9}
.inst strong{color:var(--tx);font-weight:500}

/* === 可編輯 chips === */
.chips{display:flex;gap:8px}
.chip{flex:1;display:flex;flex-direction:column;align-items:center;background:var(--bg2);border:1px solid var(--br);border-radius:8px;padding:12px;cursor:pointer;transition:border-color .2s,background .2s;position:relative;user-select:none}
.chip:hover{border-color:var(--tm);background:#eaf7f2}
.chip.editing{border-color:var(--teal);background:#eaf7f2;box-shadow:0 0 0 2px rgba(29,158,117,.15)}
.chip .v{font-size:34px;font-weight:700;color:var(--td);line-height:1;min-height:22px;display:flex;align-items:center;justify-content:center;gap:4px}
.chip .l{font-size:21px;color:var(--tx2);margin-top:3px}
.chip .edit-hint{font-size:19px;color:var(--tm);margin-top:2px;opacity:0;transition:opacity .2s}
.chip:hover .edit-hint{opacity:1}
/* 數字增減控制 */
.stepper{display:flex;align-items:center;gap:6px}
.stepper-btn{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--teal);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:var(--teal);line-height:1;transition:background .15s}
.stepper-btn:hover{background:var(--tl)}
.stepper-val{font-size:34px;font-weight:700;color:var(--td);min-width:28px;text-align:center;line-height:1}
/* 修改標記 */
.chip.modified{border-color:var(--amb);}
.chip.modified .l{color:var(--amb)}
.modified-dot{width:6px;height:6px;border-radius:50%;background:var(--amb);position:absolute;top:6px;right:6px}

/* timer */
.twrap{display:flex;justify-content:center}
.rw{position:relative;width:100px;height:100px}
.rw svg{transform:rotate(-90deg)}
.trk{fill:none;stroke:#e0ddd8;stroke-width:6}
.fil{fill:none;stroke:var(--teal);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.rlb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rn{font-family:'DM Mono',monospace;font-size:34px;font-weight:500;color:var(--tx);line-height:1}
.ru{font-size:21px;color:var(--tx2);margin-top:1px}
.phi{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--tx);padding:7px 12px;border-radius:8px;border:1px solid var(--tm);background:var(--tl)}
.phd{width:8px;height:8px;border-radius:50%;background:var(--teal)}.phd.r{background:var(--amb)}
.dban{display:none;background:var(--tl);border:1px solid var(--tm);border-radius:8px;padding:10px;text-align:center;font-size:34px;color:var(--td);font-weight:500}
.btns{display:flex;gap:8px}
.bgo{flex:2;background:var(--teal);color:#fff;border:none;border-radius:8px;padding:15px;font-size:34px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .2s}
.bgo:hover{opacity:.88}.bgo:disabled{opacity:.5;cursor:default}
.brst{flex:1;background:transparent;border:1px solid var(--br);border-radius:8px;padding:15px;font-size:17px;color:var(--tx2);cursor:pointer;font-family:inherit}
.brst:hover{background:var(--bg2)}
.nav{display:flex;gap:8px;margin-top:4px}
.npv{flex:1;background:transparent;border:1px solid var(--br);border-radius:8px;padding:15px;font-size:17px;color:var(--tx2);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px}
.npv:hover{background:var(--bg2)}.npv:disabled{opacity:.3;cursor:default}
.nnx{flex:2;background:var(--td);color:#fff;border:none;border-radius:8px;padding:15px;font-size:34px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px}
.nnx:hover{opacity:.88}
.done-scr{text-align:center;padding:2.5rem 1rem}
.done-ic{width:64px;height:64px;background:var(--tl);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem}
.done-ic i{font-size:40px;color:var(--teal)}
.done-scr h2{font-size:34px;font-weight:700;color:var(--tx);margin-bottom:.5rem}
.done-scr p{font-size:34px;color:var(--tx2);line-height:1.95}
.bres{margin-top:1.5rem;background:var(--teal);color:#fff;border:none;border-radius:8px;padding:12px 24px;font-size:34px;font-weight:500;cursor:pointer;font-family:inherit}
/* tooltip */
.tip-bar{display:flex;align-items:center;gap:6px;font-size:16px;color:var(--tx2);background:var(--bg2);border:1px solid var(--br);border-radius:8px;padding:6px 10px}
.tip-bar i{color:var(--tm);font-size:19px;flex-shrink:0}
</style>
</head>
<body>
<div class="app">
<div class="hdr">
  <div class="hic"><i class="ti ti-run"></i></div>
  <div class="htx"><h1>垂足背屈復健訓練</h1><p>右腳患側 · 足背屈 -15° · 每日訓練</p></div>
</div>
<div class="steprow" id="steprow"></div>
<div class="vrow">
  <i class="ti ti-volume" style="font-size:16px;color:var(--teal)"></i>
  <span class="vlbl">語音引導</span>
  <span class="vst" id="vst">開啟</span>
  <button class="tgl" id="vtgl" onclick="togV()" aria-label="切換語音引導"></button>
</div>
<div id="ca"></div>
</div>

};

// 預設值定義
const DEFAULTS = [

   inst:'坐在床上，左腳彎曲，<strong>右腳（患側）向前伸直</strong>，毛巾繞過右腳掌，雙手輕拉往身體方向。感受右腳小腿後側與跟腱拉緊。'},
  {id:'wall',  title:'牆面弓步',  badge:'踝關節活動', sets:3, holdSec:30, restSec:15, unit:'秒',
   vc:{s:'雙手扶牆，右腳後退，右腳跟踩穩地板',m:'保持右腳腳跟貼地，膝蓋微彎，加深伸展',e:'好，放鬆，換組'},
   inst:'雙手扶牆，<strong>右腳（患側）後退一步</strong>，腳跟貼地，左腳在前彎曲。感受右腳後側至踝關節拉伸。'},
  {id:'active',title:'坐姿背屈',  badge:'主動肌力',  sets:3, holdSec:3,  restSec:20, unit:'秒', reps:12,
   vc:{s:'坐好，右腳腳尖盡量往上抬，感受脛前肌出力',m:'維持三秒，控制放下',e:'一組完成，休息二十秒'},
   inst:'坐姿，左腳平踩地，<strong>右腳（患側）腳尖往上抬</strong>，維持 3 秒後慢慢放下。12 下 1 組。'},
  {id:'band',  title:'阻力帶背屈',badge:'阻力訓練',  sets:3, holdSec:3,  restSec:20, unit:'秒', reps:12,
   vc:{s:'彈力帶套在右腳掌前端，抵抗阻力將右腳腳背往上拉',m:'感受右腳脛前肌出力，控制速度',e:'很好，一組完成'},
   inst:'<strong>彈力帶套在右腳（患側）前掌</strong>，固定另一端於椅腳。抵抗阻力將右腳腳背往上拉，12 下 1 組。'},
  {id:'heel',  title:'離心提踵',  badge:'離心控制',  sets:3, holdSec:5,  restSec:30, unit:'秒', reps:12,
   vc:{s:'扶椅背站立，雙腳踮到最高，重心略偏右腳',m:'左腳用五秒慢慢放下，感受小腿離心控制',e:'一組完成，休息三十秒'},
   inst:'扶椅背站立，雙腳踮起，<strong>左腳用 5 秒慢慢放下</strong>，重心略偏右腳（患側）。12 下 1 組。'}
];

// 使用者自訂值（可覆蓋預設）
let custom = {}; // {id: {sets, holdSec, doneSets}}
let cur=0, voiceOn=true, tmr=null, cS={}, totS=0, days=0, ss=null;

function getVal(id, key) {
  return (custom[id] && custom[id][key] !== undefined) ? custom[id][key] : DEFAULTS.find(e=>e.id===id)[key];
}
function isModified(id) {
  const d = DEFAULTS.find(e=>e.id===id);
  if (!custom[id]) return false;
  return (custom[id].sets !== undefined && custom[id].sets !== d.sets) ||
         (custom[id].holdSec !== undefined && custom[id].holdSec !== d.holdSec);
}

function togV(){voiceOn=!voiceOn;document.getElementById('vtgl').classList.toggle('off',!voiceOn);document.getElementById('vst').textContent=voiceOn?'開啟':'關閉';}
function spk(t){if(!voiceOn||!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=0.9;window.speechSynthesis.speak(u);}

function bldS(){
  const c=document.getElementById('steprow');c.innerHTML='';
  DEFAULTS.forEach((ex,i)=>{
    if(i>0){const b=document.createElement('div');b.className='sbar'+((cS[DEFAULTS[i-1].id]||0)>=(getVal(DEFAULTS[i-1].id,'sets'))?' done':'');c.appendChild(b);}
    const d=document.createElement('div'),done=(cS[ex.id]||0)>=getVal(ex.id,'sets');
    d.className='sdot'+(i===cur?' cur':done?' done':'');
    d.innerHTML=`<div class="sn">${done&&i!==cur?'<i class="ti ti-check" style="font-size:16px"></i>':i+1}</div><div class="sl">${ex.title}</div>`;
    d.onclick=()=>go(i);c.appendChild(d);
  });
}

function go(i){if(tmr){clearInterval(tmr);tmr=null;}cur=i;bldS();render();}

// 更新 chip 顯示（用 stepper）
function updateChip(id, key, delta, minVal, maxVal) {
  if (!custom[id]) custom[id] = {};
  const cur2 = getVal(id, key);
  const newVal = Math.max(minVal, Math.min(maxVal, cur2 + delta));
  custom[id][key] = newVal;
  renderChips();
}

function renderChips() {
  const ex = DEFAULTS[cur];
  const id = ex.id;
  const sets = getVal(id,'sets');
  const hold = getVal(id,'holdSec');
  const done = cS[id] || 0;
  const mod = isModified(id);

  const setsChip = document.getElementById('chip-sets');
  const holdChip = document.getElementById('chip-hold');
  const doneChip = document.getElementById('chip-done');

  if (setsChip) setsChip.innerHTML = chipHTML(id, 'sets', sets, '組數', 1, 10, mod);
  if (holdChip) holdChip.innerHTML = chipHTML(id, 'hold', hold, '保持秒數', 1, 120, mod);
  if (doneChip) doneChip.innerHTML = `
    <div class="v">${done}</div>
    <div class="l">已完成組</div>`;
}

function chipHTML(id, key, val, label, min, max, mod) {
  const dbKey = key === 'hold' ? 'holdSec' : 'sets';
  return `
    <div class="stepper">
      <button class="stepper-btn" onclick="event.stopPropagation();updateChip('${id}','${dbKey}',-1,${min},${max})">−</button>
      <span class="stepper-val">${val}</span>
      <button class="stepper-btn" onclick="event.stopPropagation();updateChip('${id}','${dbKey}',1,${min},${max})">+</button>
    </div>
    <div class="l" style="color:${mod?'var(--amb)':'var(--tx2)'}">${label}${mod?' ✎':''}</div>`;
}

function render(){
  const ex = DEFAULTS[cur];
  const id = ex.id;
  const sets = getVal(id,'sets');
  const hold = getVal(id,'holdSec');
  const done = cS[id] || 0;
  const isDone = done >= sets;
  const last = cur === DEFAULTS.length-1;
  const mod = isModified(id);

  document.getElementById('ca').innerHTML=`
    <div class="card">
      <div class="ctop">
        <div class="cn">${cur+1}</div>
        <span class="ct">${ex.title}</span>
        <span class="cbdg">${ex.badge}</span>
        ${mod?'<span style="font-size:21px;color:var(--amb);background:#FFF3D6;padding:2px 7px;border-radius:20px;border:1px solid #FAEEDA">已調整</span>':''}
      </div>
      <div class="cbody">
        <div class="illus">${SVGS[id]}</div>
        <div class="leg">
          <div class="li"><div class="ld" style="background:#5DCAA5"></div>右腳患側</div>
          <div class="li"><div class="ld" style="background:#8090C8"></div>左腳健側</div>
          <div class="li"><div class="ld" style="background:#EF9F27"></div>動作重點</div>
          <div class="li"><div class="ld" style="background:#E24B4A"></div>拉伸感</div>
        </div>
        <p class="inst">${ex.inst}</p>

        <div class="tip-bar">
          <i class="ti ti-adjustments-horizontal"></i>
          <span>點擊 <strong>＋ / −</strong> 可調整組數與保持秒數，不調整則直接使用預設值開始訓練</span>
        </div>

        <div class="chips">
          <div class="chip" id="chip-sets">
            ${chipHTML(id,'sets',sets,'組數',1,10,mod)}
          </div>
          <div class="chip" id="chip-hold">
            ${chipHTML(id,'hold',hold,'保持秒數',1,120,mod)}
          </div>
          <div class="chip" id="chip-done">
            <div class="v">${done}</div>
            <div class="l">已完成組</div>
          </div>
        </div>

        <div class="phi" id="phi" style="display:none"><div class="phd" id="phd"></div><span id="pht">準備中</span></div>
        <div class="twrap">
          <div class="rw">
            <svg width="100" height="100" viewBox="0 0 100 100">
              <circle class="trk" cx="50" cy="50" r="42"/>
              <circle class="fil" id="ring" cx="50" cy="50" r="42" stroke-dasharray="${C42}" stroke-dashoffset="0"/>
            </svg>
            <div class="rlb"><span class="rn" id="tc">${isDone?'✓':'--'}</span><span class="ru">秒</span></div>
          </div>
        </div>
        <div class="dban" id="ban" style="${isDone?'display:block':''}">✓ 右腳訓練完成！共 ${sets} 組</div>
        <div class="btns">
          <button class="bgo" id="bgo" onclick="startEx()" ${isDone?'disabled style="background:var(--td)"':''}>
            ${isDone?'<i class="ti ti-circle-check"></i> 已完成':'<i class="ti ti-player-play"></i> 開始訓練'}
          </button>
          <button class="brst" onclick="rst()">重置</button>
        </div>
        <div class="nav">
          <button class="npv" onclick="go(${cur-1})" ${cur===0?'disabled':''}>
            <i class="ti ti-arrow-left"></i> 上一個
          </button>
          <button class="nnx" onclick="${last?'finishAll()':'go('+(cur+1)+')'}">
            ${last?'完成訓練 <i class="ti ti-flag"></i>':'下一個 <i class="ti ti-arrow-right"></i>'}
          </button>
        </div>
      </div>
    </div>`;
}

function startEx(){
  const ex = DEFAULTS[cur];
  const id = ex.id;
  if(tmr)return;
  document.getElementById('bgo').disabled=true;
  document.getElementById('bgo').innerHTML='<i class="ti ti-loader"></i> 進行中...';
  if(!ss){ss=Date.now();days++;}
  spk(ex.vc.s);
  runSet(id, ex, 1);
}

function runSet(id, ex, n){
  const sets = getVal(id,'sets');
  const hold = getVal(id,'holdSec');
  const ring=document.getElementById('ring'),tc=document.getElementById('tc'),
    phi=document.getElementById('phi'),phd=document.getElementById('phd'),pht=document.getElementById('pht');
  if(!ring)return;
  phi.style.display='flex';phd.className='phd';
  pht.textContent=`第 ${n} / ${sets} 組`;
  let rem=hold;tc.textContent=rem;ring.style.strokeDashoffset='0';ring.style.stroke='var(--teal)';
  const mid=Math.floor(hold/2);
  tmr=setInterval(()=>{
    rem--;
    const t=document.getElementById('tc'),r=document.getElementById('ring');
    if(!t){clearInterval(tmr);tmr=null;return;}
    t.textContent=rem;
    r.style.strokeDashoffset=C42*(1-rem/hold);
    if(rem===mid)spk(ex.vc.m);
    if(rem<=0){
      clearInterval(tmr);tmr=null;
      const d=(cS[id]||0)+1;cS[id]=d;totS++;
      renderChips();
      if(d>=sets){
        spk('右腳'+ex.title+'全部完成！');
        mkDone(sets);bldS();
      } else {
        spk(ex.vc.e);
        const p=document.getElementById('phd'),pt=document.getElementById('pht');
        if(p)p.className='phd r';
        const rest=ex.restSec;
        if(pt)pt.textContent=`休息 ${rest} 秒`;
        runRest(id, ex, n+1, rest);
      }
    }
  },1000);
}

function runRest(id, ex, nxt, rs){
  let rem=rs;
  const t=document.getElementById('tc'),r=document.getElementById('ring');
  if(t)t.textContent=rem;
  if(r){r.style.stroke='var(--amb)';r.style.strokeDashoffset='0';}
  tmr=setInterval(()=>{
    rem--;
    const t2=document.getElementById('tc'),r2=document.getElementById('ring');
    if(!t2){clearInterval(tmr);tmr=null;return;}
    t2.textContent=rem;
    r2.style.strokeDashoffset=C42*(1-rem/rs);
    if(rem<=0){
      clearInterval(tmr);tmr=null;
      r2.style.stroke='var(--teal)';
      spk('休息結束，開始第'+nxt+'組');
      runSet(id, ex, nxt);
    }
  },1000);
}

function mkDone(sets){
  const ban=document.getElementById('ban'),b=document.getElementById('bgo'),
    phi=document.getElementById('phi'),tc=document.getElementById('tc');
  if(ban)ban.style.display='block';
  if(b){b.innerHTML='<i class="ti ti-circle-check"></i> 已完成';b.style.background='var(--td)';b.disabled=true;}
  if(phi)phi.style.display='none';
  if(tc)tc.textContent='✓';
}

function rst(){
  if(tmr){clearInterval(tmr);tmr=null;}
  cS[DEFAULTS[cur].id]=0;
  bldS();render();
}

function finishAll(){
  if(tmr){clearInterval(tmr);tmr=null;}
  const mins=ss?Math.round((Date.now()-ss)/60000):0;
  spk('今日訓練全部完成，做得非常好！');
  document.getElementById('ca').innerHTML=`
    <div class="card">
      <div class="done-scr">
        <div class="done-ic"><i class="ti ti-trophy" style="font-size:38px;color:var(--teal)"></i></div>
        <h2>今日訓練完成！</h2>
        <p>完成 <strong>${totS}</strong> 組 · 訓練 <strong>${mins}</strong> 分鐘<br><br>右腳復健需要每日堅持，<br>每週進步 1–2° 就是很好的成果。</p>
        <button class="bres" onclick="restart()"><i class="ti ti-refresh"></i> 重新開始</button>
      </div>
    </div>`;
}

function restart(){cur=0;cS={};custom={};totS=0;ss=null;days=0;bldS();render();}

bldS();render();
</script>
</body>
