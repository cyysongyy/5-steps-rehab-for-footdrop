<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>垂足背屈復健訓練</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#1D9E75;--tl:#E1F5EE;--tm:#5DCAA5;--td:#0F6E56;--tdd:#085041;
  --amb:#EF9F27;--al:#FAEEDA;--amd:#854F0B;
  --red:#E24B4A;--rl:#FCEBEB;
  --bg:#fff;--bg2:#f7f6f2;--bg3:#f0ede8;
  --tx:#1a1a1a;--tx2:#6b6b6b;--tx3:#999;
  --br:#e0ddd8;--br2:#ccc;
  --ra:14px;--ra2:10px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg3);min-height:100vh;padding:1rem 1rem 2rem}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:.75rem}

/* Header */
.hdr{background:var(--bg);border-radius:var(--ra);border:1px solid var(--br);padding:14px 16px;display:flex;align-items:center;gap:12px}
.hic{width:42px;height:42px;background:var(--tl);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hic i{font-size:22px;color:var(--td)}
.htx h1{font-size:18px;font-weight:700;color:var(--tx);letter-spacing:-.2px}
.htx p{font-size:13px;color:var(--tx2);margin-top:2px}

/* Step nav */
.steprow{background:var(--bg);border-radius:var(--ra);border:1px solid var(--br);padding:14px 16px;display:flex;align-items:flex-start;overflow-x:auto;scrollbar-width:none;gap:0}
.steprow::-webkit-scrollbar{display:none}
.sdot{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex-shrink:0;min-width:56px}
.sn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--br2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--tx2);background:var(--bg);transition:all .2s}
.sdot.done .sn{background:var(--teal);border-color:var(--teal);color:#fff}
.sdot.cur .sn{background:var(--tl);border-color:var(--teal);color:var(--td)}
.sl{font-size:11px;color:var(--tx2);text-align:center;line-height:1.3;white-space:nowrap}
.sdot.cur .sl{color:var(--td);font-weight:600}
.sdot.done .sl{color:var(--teal);font-weight:500}
.sbar{flex:1;height:1.5px;background:var(--br);min-width:6px;max-width:20px;flex-shrink:1;margin-top:14px;transition:background .3s;align-self:flex-start}
.sbar.done{background:var(--teal)}

/* Voice toggle */
.vrow{background:var(--bg);border-radius:var(--ra2);border:1px solid var(--br);padding:10px 14px;display:flex;align-items:center;gap:10px}
.vlbl{font-size:14px;color:var(--tx2);flex:1}
.vst{font-size:13px;color:var(--td);font-weight:600}
.tgl{width:38px;height:22px;background:var(--teal);border-radius:11px;border:none;cursor:pointer;position:relative;flex-shrink:0;transition:background .2s}
.tgl.off{background:#ccc}
.tgl::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl:not(.off)::after{transform:translateX(16px)}

/* Card */
.card{background:var(--bg);border-radius:var(--ra);border:1px solid var(--br);overflow:hidden;box-shadow:var(--shadow)}
.ctop{padding:13px 16px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:10px}
.cnum{width:26px;height:26px;border-radius:50%;background:var(--tl);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--td);flex-shrink:0}
.ct{font-size:17px;font-weight:700;color:var(--tx);flex:1;letter-spacing:-.2px}
.cbdg{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--tl);color:var(--td);font-weight:600;border:1px solid rgba(29,158,117,.2)}
.cbody{padding:14px;display:flex;flex-direction:column;gap:12px}

/* Illustration area */
.illus-wrap{background:var(--bg2);border-radius:var(--ra2);border:1px solid var(--br);overflow:hidden;position:relative}
.illus-wrap svg{display:block;width:100%;height:auto}

/* Legend */
.leg{display:flex;gap:6px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx2)}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Instruction */
.inst-box{background:var(--bg2);border-radius:var(--ra2);border:1px solid var(--br);padding:11px 13px}
.inst-box p{font-size:13.5px;color:var(--tx2);line-height:1.8}
.inst-box p strong{color:var(--td);font-weight:600}

/* Chips / param controls */
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--bg2);border:1px solid var(--br);border-radius:var(--ra2);padding:11px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .2s}
.chip.mod{border-color:var(--amb)}
.chip-label{font-size:11px;color:var(--tx2)}
.chip.mod .chip-label{color:var(--amd)}
.chip-val{font-size:20px;font-weight:700;color:var(--td);line-height:1}
.stepper{display:flex;align-items:center;gap:5px}
.stp-btn{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--teal);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--teal);line-height:1;transition:background .15s;flex-shrink:0}
.stp-btn:hover{background:var(--tl)}
.stp-val{font-size:20px;font-weight:700;color:var(--td);min-width:26px;text-align:center}

/* Phase indicator */
.phi{display:none;align-items:center;gap:8px;font-size:13px;color:var(--tx);padding:8px 12px;border-radius:var(--ra2);border:1px solid var(--tm);background:var(--tl)}
.phd{width:8px;height:8px;border-radius:50%;background:var(--teal);flex-shrink:0}
.phd.rest{background:var(--amb)}

/* Timer ring */
.twrap{display:flex;justify-content:center;padding:4px 0}
.rw{position:relative;width:90px;height:90px}
.rw svg{transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--br);stroke-width:5}
.fil{fill:none;stroke:var(--teal);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.rlb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rn{font-family:'DM Mono',monospace;font-size:26px;font-weight:500;color:var(--tx);line-height:1}
.ru{font-size:11px;color:var(--tx2);margin-top:2px}

/* Done banner */
.dban{display:none;background:var(--tl);border:1px solid var(--tm);border-radius:var(--ra2);padding:10px 13px;text-align:center;font-size:14px;font-weight:600;color:var(--td)}

/* Buttons */
.btns{display:flex;gap:8px}
.bgo{flex:2;background:var(--teal);color:#fff;border:none;border-radius:var(--ra2);padding:13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .2s;letter-spacing:-.1px}
.bgo:hover{opacity:.88}.bgo:disabled{opacity:.5;cursor:default}
.brst{flex:1;background:transparent;border:1px solid var(--br);border-radius:var(--ra2);padding:13px;font-size:13px;color:var(--tx2);cursor:pointer;font-family:inherit;transition:background .15s}
.brst:hover{background:var(--bg2)}
.nav{display:flex;gap:8px}
.npv{flex:1;background:transparent;border:1px solid var(--br);border-radius:var(--ra2);padding:13px;font-size:13px;color:var(--tx2);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px;transition:background .15s}
.npv:hover:not(:disabled){background:var(--bg2)}
.npv:disabled{opacity:.3;cursor:default}
.nnx{flex:2;background:var(--td);color:#fff;border:none;border-radius:var(--ra2);padding:13px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;transition:opacity .2s}
.nnx:hover{opacity:.88}

/* Done screen */
.done-scr{text-align:center;padding:2rem 1rem 2.5rem}
.done-ic{width:60px;height:60px;background:var(--tl);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem}
.done-scr h2{font-size:20px;font-weight:700;color:var(--tx);margin-bottom:.5rem}
.done-scr p{font-size:14px;color:var(--tx2);line-height:1.9}
.bres{margin-top:1.5rem;background:var(--teal);color:#fff;border:none;border-radius:var(--ra2);padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}

/* Tip */
.tip{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--tx2);background:var(--bg2);border-radius:var(--ra2);padding:9px 11px;border:1px solid var(--br)}
.tip i{color:var(--tm);flex-shrink:0;margin-top:1px}
</style>
</head>
<body>
<div class="app">

<div class="hdr">
  <div class="hic"><i class="ti ti-run"></i></div>
  <div class="htx">
    <h1>垂足背屈復健訓練</h1>
    <p>右腳患側 · 足背屈 −15° · 每日訓練</p>
  </div>
</div>

<div class="steprow" id="steprow"></div>

<div class="vrow">
  <i class="ti ti-volume" style="font-size:16px;color:var(--teal)"></i>
  <span class="vlbl">語音引導</span>
  <span class="vst" id="vst">開啟</span>
  <button class="tgl" id="vtgl" onclick="togV()"></button>
</div>

<div id="ca"></div>

</div>

let custom={}, cur=0, voiceOn=true, tmr=null, cS={}, totS=0, ss=null;

function getVal(id,key){return(custom[id]&&custom[id][key]!==undefined)?custom[id][key]:DEFAULTS.find(e=>e.id===id)[key];}
function isModified(id){const d=DEFAULTS.find(e=>e.id===id);if(!custom[id])return false;return(custom[id].sets!==undefined&&custom[id].sets!==d.sets)||(custom[id].holdSec!==undefined&&custom[id].holdSec!==d.holdSec);}

function togV(){voiceOn=!voiceOn;document.getElementById('vtgl').classList.toggle('off',!voiceOn);document.getElementById('vst').textContent=voiceOn?'開啟':'關閉';}
function spk(t){if(!voiceOn||!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=0.9;window.speechSynthesis.speak(u);}

function bldS(){
  const c=document.getElementById('steprow');c.innerHTML='';
  DEFAULTS.forEach((ex,i)=>{
    if(i>0){const b=document.createElement('div');b.className='sbar'+((cS[DEFAULTS[i-1].id]||0)>=(getVal(DEFAULTS[i-1].id,'sets'))?' done':'');c.appendChild(b);}
    const d=document.createElement('div'),done=(cS[ex.id]||0)>=getVal(ex.id,'sets');
    d.className='sdot'+(i===cur?' cur':done?' done':'');
    d.innerHTML=`<div class="sn">${done&&i!==cur?'<i class="ti ti-check" style="font-size:13px"></i>':i+1}</div><div class="sl">${ex.title}</div>`;
    d.onclick=()=>go(i);c.appendChild(d);
  });
}

function go(i){if(tmr){clearInterval(tmr);tmr=null;}cur=i;bldS();render();}

function updateChip(id,key,delta,min,max){
  if(!custom[id])custom[id]={};
  const v=Math.max(min,Math.min(max,getVal(id,key)+delta));
  custom[id][key]=v;renderChips();
}

function renderChips(){
  const ex=DEFAULTS[cur];const id=ex.id;
  const sets=getVal(id,'sets'),hold=getVal(id,'holdSec'),done=cS[id]||0,mod=isModified(id);
  const sc=document.getElementById('chip-sets'),hc=document.getElementById('chip-hold'),dc=document.getElementById('chip-done');
  if(sc)sc.outerHTML=setsChipHTML(id,sets,mod);
  if(hc)hc.outerHTML=holdChipHTML(id,hold,mod);
  if(dc)dc.innerHTML=`<div class="chip-val">${done}</div><div class="chip-label">已完成組</div>`;
}

        <svg width="90" height="90" viewBox="0 0 100 100">
          <circle class="trk" cx="50" cy="50" r="42"/>
          <circle class="fil" id="ring" cx="50" cy="50" r="42" stroke-dasharray="${C42}" stroke-dashoffset="0"/>
        </svg>
        <div class="rlb"><span class="rn" id="tc">${isDone?'✓':'--'}</span><span class="ru">秒</span></div>
      </div>
    </div>

    <div class="dban" id="ban" style="${isDone?'display:block':''}">✓ 完成 ${sets} 組！</div>

    <div class="btns">
      <button class="bgo" id="bgo" onclick="startEx()" ${isDone?'disabled':''}>${isDone?'<i class="ti ti-circle-check"></i> 已完成':'<i class="ti ti-player-play"></i> 開始訓練'}</button>
      <button class="brst" onclick="rst()">重置</button>
    </div>
    <div class="nav">
      <button class="npv" onclick="go(${cur-1})" ${cur===0?'disabled':''}><i class="ti ti-arrow-left"></i> 上一個</button>
      <button class="nnx" onclick="${last?'finishAll()':'go('+(cur+1)+')'}">
        ${last?'完成訓練 <i class="ti ti-flag"></i>':'下一個 <i class="ti ti-arrow-right"></i>'}
      </button>
    </div>
  </div>
</div>`;

  if(isDone){const b=document.getElementById('bgo');if(b)b.style.background='var(--td)';}
}

function startEx(){
  const ex=DEFAULTS[cur],id=ex.id;
  if(tmr)return;
  document.getElementById('bgo').disabled=true;
  document.getElementById('bgo').innerHTML='<i class="ti ti-loader"></i> 進行中…';
  if(!ss)ss=Date.now();
  spk(ex.vc.s);
  runSet(id,ex,1);
}

function runSet(id,ex,n){
  const sets=getVal(id,'sets'),hold=getVal(id,'holdSec');
  const ring=document.getElementById('ring'),tc=document.getElementById('tc'),phi=document.getElementById('phi'),phd=document.getElementById('phd'),pht=document.getElementById('pht');
  if(!ring)return;
  phi.style.display='flex';phd.className='phd';pht.textContent=`第 ${n} / ${sets} 組`;
  let rem=hold;tc.textContent=rem;ring.style.strokeDashoffset='0';ring.style.stroke='var(--teal)';
  const mid=Math.floor(hold/2);
  tmr=setInterval(()=>{
    rem--;
    const t=document.getElementById('tc'),r=document.getElementById('ring');
    if(!t){clearInterval(tmr);tmr=null;return;}
    t.textContent=rem;r.style.strokeDashoffset=C42*(1-rem/hold);
    if(rem===mid)spk(ex.vc.m);
    if(rem<=0){
      clearInterval(tmr);tmr=null;
      const d=(cS[id]||0)+1;cS[id]=d;totS++;
      renderChips();
      if(d>=sets){
        spk('右腳'+ex.title+'全部完成！');
        mkDone(sets);bldS();
      } else {
        spk(ex.vc.e);
        const p=document.getElementById('phd'),pt=document.getElementById('pht');
        if(p)p.className='phd rest';if(pt)pt.textContent=`休息 ${ex.restSec} 秒`;
        runRest(id,ex,n+1,ex.restSec);
      }
    }
  },1000);
}

function runRest(id,ex,nxt,rs){
  let rem=rs;
  const t=document.getElementById('tc'),r=document.getElementById('ring');
  if(t)t.textContent=rem;if(r){r.style.stroke='var(--amb)';r.style.strokeDashoffset='0';}
  tmr=setInterval(()=>{
    rem--;
    const t2=document.getElementById('tc'),r2=document.getElementById('ring');
    if(!t2){clearInterval(tmr);tmr=null;return;}
    t2.textContent=rem;r2.style.strokeDashoffset=C42*(1-rem/rs);
    if(rem<=0){clearInterval(tmr);tmr=null;r2.style.stroke='var(--teal)';spk('休息結束，開始第'+nxt+'組');runSet(id,ex,nxt);}
  },1000);
}

function mkDone(sets){
  const ban=document.getElementById('ban'),b=document.getElementById('bgo'),phi=document.getElementById('phi'),tc=document.getElementById('tc');
  if(ban)ban.style.display='block';
  if(b){b.innerHTML='<i class="ti ti-circle-check"></i> 已完成';b.style.background='var(--td)';b.disabled=true;}
  if(phi)phi.style.display='none';if(tc)tc.textContent='✓';
}

function rst(){if(tmr){clearInterval(tmr);tmr=null;}cS[DEFAULTS[cur].id]=0;bldS();render();}

function finishAll(){
  if(tmr){clearInterval(tmr);tmr=null;}
  const mins=ss?Math.round((Date.now()-ss)/60000):0;
  spk('今日訓練全部完成，做得非常好！');
  document.getElementById('ca').innerHTML=`
<div class="card">
  <div class="done-scr">
    <div class="done-ic"><i class="ti ti-trophy" style="font-size:34px;color:var(--teal)"></i></div>
    <h2>今日訓練完成！</h2>
    <p>完成 <strong>${totS}</strong> 組 · 訓練 <strong>${mins}</strong> 分鐘<br><br>右腳復健需要每日堅持，<br>每週進步 1–2° 就是很好的成果。</p>
    <button class="bres" onclick="restart()"><i class="ti ti-refresh"></i> 重新開始</button>
  </div>
</div>`;}

function restart(){cur=0;cS={};custom={};totS=0;ss=null;bldS();render();}

bldS();render();
</script>
</body>
</html>
